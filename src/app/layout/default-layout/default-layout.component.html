<!--sidebar-->
<c-sidebar #sidebar1="cSidebar" class="d-print-none sidebar sidebar-fixed border-end" colorScheme="dark" id="sidebar1"
  visible>
  <!----------------------- OWN LOGO BELOW ------------------------>
  <c-sidebar-header class="border-bottom">
    <c-sidebar-brand [routerLink]="['/']" class="d-flex align-items-center justify-content-center">
      <img src="assets/images/audi-speech-banner-bg.png" alt="AudiSpeech Logo" style="height: 70px; width: auto;" />
      <!-- <img src="assets/images/Audi_Speech_text.png" alt="AudiSpeech" style="height: 90px; width: auto;" /> -->
    </c-sidebar-brand>
  </c-sidebar-header>
  <!----------------------- OWN LOGO ABOVE ------------------------>

  <ng-scrollbar pointerEventsMethod="scrollbar" visibility="hover">
    <c-sidebar-nav [navItems]="navItems" dropdownMode="close" compact />
  </ng-scrollbar>

  @if (!sidebar1.narrow) {
  <!-- <c-sidebar-footer cSidebarToggle="sidebar1" class="border-top d-none d-lg-flex" toggle="unfoldable" style="cursor: pointer;">
      <button cSidebarToggler aria-label="Toggle sidebar fold"></button>
    </c-sidebar-footer> -->
  }
</c-sidebar>

<!--main-->
<div class="wrapper d-flex flex-column min-vh-100">
  <!--app-header-->
  <app-default-header [cShadowOnScroll]="'sm'" class="mb-4 d-print-none header header-sticky p-0 shadow-sm"
    position="sticky" sidebarId="sidebar1" />
  <!--app-body-->
  <div class="body flex-grow-1">
    <c-container breakpoint="lg" class="h-auto px-4">
      <router-outlet />
    </c-container>
  </div>
  <!--app footer-->
  <app-default-footer />
</div>
