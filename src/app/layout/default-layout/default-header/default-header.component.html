<ng-container>

  <c-container [fluid]="true" class="border-bottom px-4">

    <c-header-nav class="mx-auto">
    </c-header-nav>

    <c-header-nav class="mx-0">
      <ng-container *ngTemplateOutlet="userDropdown" />
    </c-header-nav>

  </c-container>

  <!-- <c-container [fluid]="true" class="px-4">
    <c-breadcrumb-router />
  </c-container> -->

</ng-container>


<ng-template #userDropdown>

  <c-dropdown [popperOptions]="{ placement: 'bottom-start' }" variant="nav-item">

    <button [caret]="false" cDropdownToggle class="py-0 pe-0" aria-label="Open user menu">

      <c-avatar shape="rounded-1" size="md" src="./assets/images/login-cover.jpg" status="success" textColor="primary"
        alt="User avatar" />

    </button>


    <ul cDropdownMenu class="pt-0 w-auto">
      <li>
        <a cDropdownItem class="fw-bold">
          {{this.localData?.name}}
        </a>
      </li>
      <li>
        <a cDropdownItem (click)="dbBackup()">
          <svg cIcon class="me-2" name="cilSave"></svg>
          Backup
        </a>
        <a cDropdownItem (click)="logout()">
          <svg cIcon class="me-2" name="cilAccountLogout"></svg>
          Logout
        </a>
      </li>

    </ul>

  </c-dropdown>

</ng-template>
