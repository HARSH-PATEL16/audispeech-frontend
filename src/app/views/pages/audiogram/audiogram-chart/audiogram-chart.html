<svg class="audiogram-svg" [attr.viewBox]="'0 0 ' + chartWidth + ' ' + chartHeight">

    <!-- ============================= -->
    <!-- OUTER BORDER                  -->
    <!-- ============================= -->

    <rect [attr.x]="leftPadding" [attr.y]="topPadding" [attr.width]="graphWidth" [attr.height]="graphHeight" rx="2"
        ry="2" class="outer-border">
    </rect>


    <!-- ============================= -->
    <!-- HORIZONTAL GRID               -->
    <!-- ============================= -->

    <ng-container *ngFor="let db of dbValues">

        <line class="grid-line" [class.major-grid]="db % 20 === 0" [attr.x1]="leftPadding" [attr.y1]="yForDb(db)"
            [attr.x2]="leftPadding + graphWidth" [attr.y2]="yForDb(db)">
        </line>


        <text class="axis-label" text-anchor="end" [attr.x]="leftPadding - 8" [attr.y]="yForDb(db) + 5">

            {{ db }}

        </text>

    </ng-container>


    <!-- ============================= -->
    <!-- VERTICAL GRID                 -->
    <!-- ============================= -->

    <!-- FIRST EMPTY LINE -->

    <line class="grid-line" [attr.x1]="leftPadding" [attr.y1]="topPadding" [attr.x2]="leftPadding"
        [attr.y2]="topPadding + graphHeight">
    </line>


    <!-- FREQUENCY LINES -->

    <ng-container *ngFor="let f of gridFrequencies; let i = index">

        <line class="grid-line" [attr.x1]="xForFrequency(f)" [attr.y1]="topPadding" [attr.x2]="xForFrequency(f)"
            [attr.y2]="topPadding + graphHeight">
        </line>


        <!-- TOP NUMBER -->

        <text class="freq-label" text-anchor="middle" [attr.x]="xForFrequency(f)" y="20">

            {{ i + 1 }}

        </text>


        <!-- FREQUENCY -->

        <text class="freq-label" text-anchor="middle" [attr.x]="xForFrequency(f)" [attr.y]="40">

            {{ f >= 1000 ? (f / 1000) + 'K' : f }}

        </text>

    </ng-container>


    <!-- LAST EMPTY LINE -->

    <line class="grid-line" [attr.x1]="leftPadding + graphWidth" [attr.y1]="topPadding"
        [attr.x2]="leftPadding + graphWidth" [attr.y2]="topPadding + graphHeight">
    </line>


    <!-- ============================= -->
    <!-- BOTTOM LABELS                 -->
    <!-- ============================= -->

    <ng-container *ngFor="let item of bottomLabels">

        <text class="freq-label" text-anchor="middle" [attr.x]="xForFrequency(item.frequency)"
            [attr.y]="chartHeight - 25">

            {{ item.label }}

        </text>

    </ng-container>


    <!-- ============================= -->
    <!-- AIR CONDUCTION                -->
    <!-- ============================= -->

    <polyline *ngFor="let line of airLines()" [attr.points]="line.points" [attr.stroke]="line.color" stroke-width="3"
        fill="none">
    </polyline>


    <!-- ============================= -->
    <!-- BONE CONDUCTION               -->
    <!-- ============================= -->

    <polyline *ngFor="let line of boneLines()" [attr.points]="line.points" [attr.stroke]="line.color" stroke-width="3"
        stroke-dasharray="10 8" fill="none">
    </polyline>


    <!-- ========================================= -->
    <!-- AUDIOGRAM SYMBOLS                        -->
    <!-- ========================================= -->

    <ng-container *ngFor="let p of points()">


        <!-- ========================================= -->
        <!-- RIGHT AIR ○                              -->
        <!-- N.R. → LOWER LEFT ↙                     -->
        <!-- ========================================= -->

        <g *ngIf="p.symbol === 'circle'" [attr.stroke]="p.color" stroke-width="2.5" fill="white">

            <circle [attr.cx]="p.x" [attr.cy]="p.y" r="9">
            </circle>


            <!-- N.R. ARROW -->

            <g *ngIf="p.noResponse" fill="none" [attr.stroke]="p.color" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">

                <line [attr.x1]="p.x - 5" [attr.y1]="p.y + 5" [attr.x2]="p.x - 15" [attr.y2]="p.y + 15">
                </line>

                <polyline [attr.points]="
                        (p.x - 10) + ',' + (p.y + 15) + ' ' +
                        (p.x - 15) + ',' + (p.y + 15) + ' ' +
                        (p.x - 15) + ',' + (p.y + 10)
                    ">
                </polyline>

            </g>

        </g>


        <!-- ========================================= -->
        <!-- LEFT AIR ✕                               -->
        <!-- N.R. → LOWER RIGHT ↘                    -->
        <!-- ========================================= -->

        <g *ngIf="p.symbol === 'cross'" [attr.stroke]="p.color" stroke-width="2.5" fill="none" stroke-linecap="round">

            <line [attr.x1]="p.x - 9" [attr.y1]="p.y - 8" [attr.x2]="p.x + 9" [attr.y2]="p.y + 8">
            </line>

            <line [attr.x1]="p.x - 9" [attr.y1]="p.y + 8" [attr.x2]="p.x + 9" [attr.y2]="p.y - 8">
            </line>


            <!-- N.R. ARROW -->

            <g *ngIf="p.noResponse" fill="none" [attr.stroke]="p.color" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">

                <line [attr.x1]="p.x + 5" [attr.y1]="p.y + 5" [attr.x2]="p.x + 15" [attr.y2]="p.y + 15">
                </line>

                <polyline [attr.points]="
                        (p.x + 10) + ',' + (p.y + 15) + ' ' +
                        (p.x + 15) + ',' + (p.y + 15) + ' ' +
                        (p.x + 15) + ',' + (p.y + 10)
                    ">
                </polyline>

            </g>

        </g>


        <!-- ========================================= -->
        <!-- RIGHT MASK △                             -->
        <!-- N.R. → LOWER LEFT ↙                     -->
        <!-- ========================================= -->

        <g *ngIf="p.symbol === 'triangle'" [attr.stroke]="p.color" stroke-width="2.5" fill="white">

            <polygon [attr.points]="
                    p.x + ',' + (p.y - 10) + ' ' +
                    (p.x - 8) + ',' + (p.y + 7) + ' ' +
                    (p.x + 8) + ',' + (p.y + 7)
                ">
            </polygon>


            <!-- N.R. ARROW -->

            <g *ngIf="p.noResponse" fill="none" [attr.stroke]="p.color" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">

                <line [attr.x1]="p.x - 5" [attr.y1]="p.y + 5" [attr.x2]="p.x - 15" [attr.y2]="p.y + 15">
                </line>

                <polyline [attr.points]="
                        (p.x - 10) + ',' + (p.y + 15) + ' ' +
                        (p.x - 15) + ',' + (p.y + 15) + ' ' +
                        (p.x - 15) + ',' + (p.y + 10)
                    ">
                </polyline>

            </g>

        </g>


        <!-- ========================================= -->
        <!-- LEFT MASK □                              -->
        <!-- N.R. → LOWER RIGHT ↘                    -->
        <!-- ========================================= -->

        <g *ngIf="p.symbol === 'square'" [attr.stroke]="p.color" stroke-width="2.5" fill="white">

            <rect [attr.x]="p.x - 9" [attr.y]="p.y - 9" width="18" height="18">
            </rect>


            <!-- N.R. ARROW -->

            <g *ngIf="p.noResponse" fill="none" [attr.stroke]="p.color" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">

                <line [attr.x1]="p.x + 6" [attr.y1]="p.y + 6" [attr.x2]="p.x + 16" [attr.y2]="p.y + 16">
                </line>

                <polyline [attr.points]="
                        (p.x + 11) + ',' + (p.y + 16) + ' ' +
                        (p.x + 16) + ',' + (p.y + 16) + ' ' +
                        (p.x + 16) + ',' + (p.y + 11)
                    ">
                </polyline>

            </g>

        </g>


        <!-- ========================================= -->
        <!-- RIGHT BC <                               -->
        <!-- N.R. → LOWER LEFT ↙                     -->
        <!-- ========================================= -->

        <g *ngIf="p.symbol === 'lt'" [attr.stroke]="p.color" stroke-width="2.5" fill="none" stroke-linecap="round"
            stroke-linejoin="round">

            <polyline [attr.points]="
                    (p.x + 7) + ',' + (p.y - 8) + ' ' +
                    (p.x - 6) + ',' + p.y + ' ' +
                    (p.x + 7) + ',' + (p.y + 8)
                ">
            </polyline>


            <!-- N.R. ARROW -->

            <g *ngIf="p.noResponse" fill="none" [attr.stroke]="p.color" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">

                <line [attr.x1]="p.x - 5" [attr.y1]="p.y + 5" [attr.x2]="p.x - 15" [attr.y2]="p.y + 15">
                </line>

                <polyline [attr.points]="
                        (p.x - 10) + ',' + (p.y + 15) + ' ' +
                        (p.x - 15) + ',' + (p.y + 15) + ' ' +
                        (p.x - 15) + ',' + (p.y + 10)
                    ">
                </polyline>

            </g>

        </g>


        <!-- ========================================= -->
        <!-- LEFT BC >                                -->
        <!-- N.R. → LOWER RIGHT ↘                    -->
        <!-- ========================================= -->

        <g *ngIf="p.symbol === 'gt'" [attr.stroke]="p.color" stroke-width="2.5" fill="none" stroke-linecap="round"
            stroke-linejoin="round">

            <polyline [attr.points]="
                    (p.x - 7) + ',' + (p.y - 8) + ' ' +
                    (p.x + 6) + ',' + p.y + ' ' +
                    (p.x - 7) + ',' + (p.y + 8)
                ">
            </polyline>


            <!-- N.R. ARROW -->

            <g *ngIf="p.noResponse" fill="none" [attr.stroke]="p.color" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">

                <line [attr.x1]="p.x + 3" [attr.y1]="p.y + 5" [attr.x2]="p.x + 15" [attr.y2]="p.y + 17">
                </line>

                <polyline [attr.points]="
                        (p.x + 10) + ',' + (p.y + 17) + ' ' +
                        (p.x + 15) + ',' + (p.y + 17) + ' ' +
                        (p.x + 15) + ',' + (p.y + 12)
                    ">
                </polyline>

            </g>

        </g>


        <!-- ========================================= -->
        <!-- RIGHT MASK BC [                         -->
        <!-- N.R. → LOWER LEFT ↙                     -->
        <!-- ========================================= -->

        <g *ngIf="p.symbol === 'bracket-left'" [attr.stroke]="p.color" stroke-width="2.5" fill="none"
            stroke-linecap="round" stroke-linejoin="round">

            <polyline [attr.points]="
                    (p.x + 5) + ',' + (p.y - 8) + ' ' +
                    (p.x - 5) + ',' + (p.y - 8) + ' ' +
                    (p.x - 5) + ',' + (p.y + 8) + ' ' +
                    (p.x + 5) + ',' + (p.y + 8)
                ">
            </polyline>


            <!-- N.R. ARROW -->

            <g *ngIf="p.noResponse" fill="none" [attr.stroke]="p.color" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">

                <line [attr.x1]="p.x - 4" [attr.y1]="p.y + 5" [attr.x2]="p.x - 15" [attr.y2]="p.y + 16">
                </line>

                <polyline [attr.points]="
                        (p.x - 10) + ',' + (p.y + 16) + ' ' +
                        (p.x - 15) + ',' + (p.y + 16) + ' ' +
                        (p.x - 15) + ',' + (p.y + 11)
                    ">
                </polyline>

            </g>

        </g>


        <!-- ========================================= -->
        <!-- LEFT MASK BC ]                          -->
        <!-- N.R. → LOWER RIGHT ↘                    -->
        <!-- ========================================= -->

        <g *ngIf="p.symbol === 'bracket-right'" [attr.stroke]="p.color" stroke-width="2.5" fill="none"
            stroke-linecap="round" stroke-linejoin="round">

            <polyline [attr.points]="
                    (p.x - 5) + ',' + (p.y - 8) + ' ' +
                    (p.x + 5) + ',' + (p.y - 8) + ' ' +
                    (p.x + 5) + ',' + (p.y + 8) + ' ' +
                    (p.x - 5) + ',' + (p.y + 8)
                ">
            </polyline>


            <!-- N.R. ARROW -->

            <g *ngIf="p.noResponse" fill="none" [attr.stroke]="p.color" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">

                <line [attr.x1]="p.x + 4" [attr.y1]="p.y + 5" [attr.x2]="p.x + 15" [attr.y2]="p.y + 16">
                </line>

                <polyline [attr.points]="
                        (p.x + 10) + ',' + (p.y + 16) + ' ' +
                        (p.x + 15) + ',' + (p.y + 16) + ' ' +
                        (p.x + 15) + ',' + (p.y + 11)
                    ">
                </polyline>

            </g>

        </g>

    </ng-container>

</svg>
